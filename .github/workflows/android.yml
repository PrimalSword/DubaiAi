name: Android CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Orbis-Trade-AI-v0.2.0-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Trade-AI-v0.2.0-debug
          path: Orbis-Trade-AI-v0.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30